name: Build Android APK

on:
  push:
    branches: [ main ] # Se ejecuta cuando subes cambios a main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar dependencias
        run: npm install

      - name: Construir el bundle de React (Vite)
        run: npm run build

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Sincronizar con Capacitor
        run: |
          npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
