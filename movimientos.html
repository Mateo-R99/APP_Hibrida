<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CuentaFácil - Movimientos</title>
  <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />
</head>
<body>
  <div id="cf-toast" class="toast" role="alert" aria-live="polite"></div>

  <header class="header">
    <div class="header__brand">
      <img src="/src/assets/logo.svg" alt="" class="header__logo" />
      <div>
        <span class="header__app-name">CuentaFácil</span>
        <span id="header-business-name" class="header__business">Mi Negocio</span>
      </div>
    </div>
  </header>

  <main class="app-content">

    <h2 class="form__section-title">Movimientos</h2>
    <div class="filter-tabs" role="tablist">
      <button class="filter-tab filter-tab--active" data-filter="month">Este Mes</button>
      <button class="filter-tab" data-filter="week">Esta Semana</button>
      <button class="filter-tab" data-filter="today">Hoy</button>
    </div>
    <div class="chart-container"><canvas id="movements-chart"></canvas></div>
    <h2 class="form__section-title" style="margin-top:20px;">Historial</h2>
    <div id="movements-list" class="movements-list"></div>
    <div id="movements-empty" class="empty-state" style="display: none;">
      <span class="empty-state__icon">📄</span><p class="empty-state__text">No hay movimientos.</p>
    </div>
  </main>

  <nav class="navbar" role="navigation" aria-label="Navegación principal">
    <a href="/" class="nav-item ">
      <span class="nav-item__icon">🏠</span>
      <span class="nav-item__label">Inicio</span>
    </a>
    <a href="/ingresos.html" class="nav-item ">
      <span class="nav-item__icon">↑</span>
      <span class="nav-item__label">Ingresos</span>
    </a>
    <a href="/gastos.html" class="nav-item ">
      <span class="nav-item__icon">↓</span>
      <span class="nav-item__label">Gastos</span>
    </a>
    <a href="/movimientos.html" class="nav-item nav-item--active">
      <span class="nav-item__icon">≡</span>
      <span class="nav-item__label">Movimientos</span>
    </a>
    <a href="/metas.html" class="nav-item ">
      <span class="nav-item__icon">🎯</span>
      <span class="nav-item__label">Metas</span>
    </a>
  </nav>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
